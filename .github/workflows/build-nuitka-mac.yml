name: Build ppc2 Multi-Platform Apps with PyInstaller

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build ppc2 on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            platform: macos-intel
          - name: Windows
            os: windows-latest
            platform: windows
          - name: Linux
            os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pygame

      # --- SECRET SOURCE CODE DECRYPTION ---
      - name: Recreate Python Source File from Secret
        shell: bash
        env:
          ENCODED_SOURCE: ${{ secrets.PPC2_SOURCE_CODE }}
        run: |
          echo "$ENCODED_SOURCE" | base64 --decode > ppc2.py

      # --- MACOS SPECIFIC BUILD ---
      - name: Build macOS App Bundle with PyInstaller
        if: contains(matrix.platform, 'macos')
        run: python -m PyInstaller --onedir --windowed --name=ppc2 --icon=ppc2.icns ppc2.py

      # --- WINDOWS SPECIFIC BUILD ---
      - name: Build Windows Executable with PyInstaller
        if: matrix.platform == 'windows'
        run: python -m PyInstaller --onedir --noconsole --name=ppc2 --windows-icon-from-ico=ppc2.ico ppc2.py

      # --- LINUX SPECIFIC BUILD ---
      - name: Build Linux Executable with PyInstaller
        if: matrix.platform == 'linux'
        run: python -m PyInstaller --onedir --name=ppc2 ppc2.py
            
      # --- ASSET PACKAGING & DEPLOYMENT ---
      - name: Prepare Distribution Folder
        shell: python
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          import shutil
          import glob

          release_dir = "release_output"
          os.makedirs(release_dir, exist_ok=True)
          platform_name = os.environ.get("MATRIX_PLATFORM")

          # Determine target destination for assets and bundle
          if "macos" in platform_name:
              if os.path.exists("dist/ppc2.app"):
                  shutil.move("dist/ppc2.app", f"{release_dir}/ppc2.app")
              target_asset_dir = f"{release_dir}/ppc2.app/Contents/Resources"
          else:
              # Windows and Linux use the dist/ppc2 folder which contains the executable and _internal/
              if os.path.exists("dist/ppc2"):
                  shutil.move("dist/ppc2", f"{release_dir}/ppc2")
              target_asset_dir = f"{release_dir}/ppc2"

          os.makedirs(target_asset_dir, exist_ok=True)

          # Copy data/asset files cleanly into the root app folder (next to the executable / Resources)
          for f in glob.glob("*holidays.json"):
              shutil.copy(f, target_asset_dir)
          if os.path.exists("CalendarHelp.png"):
              shutil.copy("CalendarHelp.png", target_asset_dir)
          if os.path.exists("readme.txt"):
              shutil.copy("readme.txt", target_asset_dir)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppc2-${{ matrix.platform }}-bundle
          path: release_output/
          retention-days: 30

      - name: Release to GitHub (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
