name: Build ppc2 Multi-Platform Apps with Nuitka

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build ppc2 on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: macos-arm64
          - name: macOS (Intel)
            os: macos-15-intel
            platform: macos-intel
          - name: Windows
            os: windows-latest
            platform: windows
          - name: Linux
            os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka pygame pillow

      # Optional: Install patchelf on Linux via apt if needed for binary inspection
      - name: Install patchelf (Linux Only)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      # Pre-cache Dependency Walker for Windows non-interactive build
      - name: Setup Dependency Walker for Nuitka (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\AppData\Local\Nuitka\Nuitka\Cache\downloads\depends\x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://dependencywalker.com/depends22_x64.zip"
          $output = "$dir\depends22_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath $dir -Force
          Remove-Item $output

      # --- SECRET SOURCE CODE DECRYPTION ---
      - name: Recreate Python Source File from Secret
        shell: bash
        env:
          ENCODED_SOURCE: ${{ secrets.PPC2_SOURCE_CODE }}
        run: |
          echo "$ENCODED_SOURCE" | base64 --decode > ppc2.py

      # --- MACOS SPECIFIC BUILD ---
      - name: Build macOS App Bundle with Nuitka
        if: contains(matrix.platform, 'macos')
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-icon=ppc2.icns \
            --include-data-files="*holidays.json=./" \
            --include-data-files="CalendarHelp.png=./" \
            --include-data-files="readme.txt=./" \
            --output-filename=ppc2 \
            ppc2.py

      # --- WINDOWS SPECIFIC BUILD ---
      - name: Build Windows Executable with Nuitka
        if: matrix.platform == 'windows'
        run: python -m nuitka --standalone --windows-console-mode=disable --windows-icon-from-ico=ppc2.ico --include-data-files="*holidays.json=./" --include-data-files="CalendarHelp.png=./" --include-data-files="readme.txt=./" --output-filename=ppc2.exe ppc2.py

      # --- LINUX SPECIFIC BUILD ---
      - name: Build Linux Executable with Nuitka
        if: matrix.platform == 'linux'
        run: |
          python -m nuitka \
            --standalone \
            --include-data-files="*holidays.json=./" \
            --include-data-files="CalendarHelp.png=./" \
            --include-data-files="readme.txt=./" \
            --output-filename=ppc2 \
            ppc2.py
            
      # --- ASSET PACKAGING & DEPLOYMENT ---
      - name: Prepare Distribution Folder
        shell: python
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          import shutil

          release_dir = "release_output"
          os.makedirs(release_dir, exist_ok=True)
          platform_name = os.environ.get("MATRIX_PLATFORM")

          # Move Nuitka's finished output cleanly into release_output
          if "macos" in platform_name:
              if os.path.exists("ppc2.app"):
                  shutil.move("ppc2.app", f"{release_dir}/ppc2.app")
          else:
              if os.path.exists("ppc2.dist"):
                  shutil.move("ppc2.dist", f"{release_dir}/ppc2")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppc2-${{ matrix.platform }}-bundle
          path: release_output/
          retention-days: 30

      - name: Release to GitHub (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
