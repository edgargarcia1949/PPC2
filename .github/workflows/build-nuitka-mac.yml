name: Build ppc2 macOS App with Nuitka

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build-mac:
    name: Build ppc2.app on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recreate Python Source File from Secret
        env:
          ENCODED_SOURCE: ${{ secrets.PPC2_SOURCE_CODE }}
        run: |
          echo "$ENCODED_SOURCE" | base64 --decode > ppc2.py  

      - name: Install Dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard

      - name: Build macOS App Bundle with Nuitka
        run: |
          # Compile with --macos-app-icon to apply your ppc2.icns icon
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --output-filename=ppc2 \
            --macos-app-icon=ppc2.icns \
            ppc2.py

          echo "=== Build Complete ==="

      - name: Prepare Distribution Folder & Package Zip
        run: |
          # Create a clean release staging folder
          mkdir -p release_folder
          
          # Move the compiled .app bundle into the release folder
          mv ppc2.app release_folder/
          
          # Copy all 9 holiday JSON files and the BMP help file beside the .app bundle
          cp *holidays.json release_folder/
          cp CalendarHelp.bmp release_folder/
          
          # Zip up the contents to create ppc2ForMac.zip
          cd release_folder
          zip -r ../ppc2ForMac.zip *
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppc2-mac-bundle
          path: ppc2ForMac.zip
          retention-days: 30

      - name: Release to GitHub (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ppc2ForMac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
