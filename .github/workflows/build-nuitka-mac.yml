name: Build ppc2 Multi-Platform Apps with Nuitka

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build ppc2 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spawns three independent, parallel runners
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard pygame

      # --- SECRET SOURCE CODE DECRYPTION ---
      # This recreates the hidden ppc2.py file dynamically on all runner environments
      - name: Recreate Python Source File from Secret
        shell: bash
        env:
          ENCODED_SOURCE: ${{ secrets.PPC2_SOURCE_CODE }}
        run: |
          echo "$ENCODED_SOURCE" | base64 --decode > ppc2.py

      # --- MACOS SPECIFIC CONFIGURATION ---
      - name: Ensure Xcode Developer Directory is Set (macOS)
        if: matrix.os == 'macos-latest'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS App Bundle with Nuitka
        if: matrix.os == 'macos-latest'
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --output-filename=ppc2 \
            --macos-app-icon=ppc2.icns \
            --assume-yes-for-downloads \
            ppc2.py

      # --- WINDOWS SPECIFIC CONFIGURATION ---
      - name: Build Windows Executable with Nuitka
        if: matrix.os == 'windows-latest'
        run: |
          python -m nuitka `
            --standalone `
            --disable-console `
            --output-filename=ppc2 `
            --windows-icon-from-ico=ppc2.ico `
            --assume-yes-for-downloads `
            ppc2.py

      # --- LINUX SPECIFIC CONFIGURATION ---
      - name: Build Linux Executable with Nuitka
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m nuitka \
            --standalone \
            --output-filename=ppc2 \
            --assume-yes-for-downloads \
            ppc2.py

      # --- ASSET PACKAGING & DEPLOYMENT (UNIFIED PYTHON STEP) ---
      - name: Prepare Distribution Folder & Package Zip
        shell: python
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          import os
          import shutil
          import glob

          os.makedirs("release_folder", exist_ok=True)
          os_name = os.environ.get("MATRIX_OS")

          # Target binary movements dynamically based on the active runner OS
          if os_name == "macos-latest":
              if os.path.exists("ppc2.app"):
                  shutil.move("ppc2.app", "release_folder/ppc2.app")
              zip_name = "ppc2ForMac.zip"
          elif os_name == "windows-latest":
              if os.path.exists("ppc2.dist"):
                  shutil.move("ppc2.dist", "release_folder/ppc2.dist")
              zip_name = "ppc2ForWindows.zip"
          else:
              if os.path.exists("ppc2.dist"):
                  shutil.move("ppc2.dist", "release_folder/ppc2.dist")
              zip_name = "ppc2ForLinux.zip"

          # Copy data/asset files beside the executable structures safely
          for f in glob.glob("*holidays.json"):
              shutil.copy(f, "release_folder/")
          if os.path.exists("CalendarHelp.png"):
              shutil.copy("CalendarHelp.png", "release_folder/")
          if os.path.exists("readme.txt"):
              shutil.copy("readme.txt", "release_folder/")

          # Zip up the contents natively across all runners using Python's zip engine
          shutil.make_archive(zip_name.replace(".zip", ""), "zip", "release_folder")

          # Persist the output filename safely for downstream deployment steps
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as env_file:
                  env_file.write(f"ZIP_OUTPUT={zip_name}\n")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppc2-${{ matrix.os }}-bundle
          path: ${{ env.ZIP_OUTPUT }}
          retention-days: 30

      - name: Release to GitHub (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_OUTPUT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
