name: Build ppc2 Multi-Platform Apps with Nuitka

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build ppc2 on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            platform: macos-arm64
          - name: macOS (Intel)
            os: macos-13
            platform: macos-intel
          - name: Windows
            os: windows-latest
            platform: windows
          - name: Linux
            os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard pygame

      # --- SECRET SOURCE CODE DECRYPTION ---
      - name: Recreate Python Source File from Secret
        shell: bash
        env:
          ENCODED_SOURCE: ${{ secrets.PPC2_SOURCE_CODE }}
        run: |
          echo "$ENCODED_SOURCE" | base64 --decode > ppc2.py

      # --- MACOS SPECIFIC CONFIGURATION (Both Apple Silicon and Intel) ---
      - name: Ensure Xcode Developer Directory is Set (macOS)
        if: contains(matrix.platform, 'macos')
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS App Bundle with Nuitka
        if: contains(matrix.platform, 'macos')
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --output-filename=ppc2 \
            --macos-app-icon=ppc2.icns \
            --assume-yes-for-downloads \
            ppc2.py

      # --- WINDOWS SPECIFIC CONFIGURATION ---
      - name: Build Windows Executable with Nuitka
        if: matrix.platform == 'windows'
        run: |
          python -m nuitka `
            --standalone `
            --disable-console `
            --output-filename=ppc2 `
            --windows-icon-from-ico=ppc2.ico `
            --assume-yes-for-downloads `
            ppc2.py

      # --- LINUX SPECIFIC CONFIGURATION ---
      - name: Build Linux Executable with Nuitka
        if: matrix.platform == 'linux'
        run: |
          python -m nuitka \
            --standalone \
            --output-filename=ppc2 \
            --assume-yes-for-downloads \
            ppc2.py
            
      # --- ASSET PACKAGING & DEPLOYMENT ---
      - name: Prepare Distribution Folder
        shell: python
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          import shutil
          import glob

          release_dir = "release_output"
          os.makedirs(release_dir, exist_ok=True)
          platform_name = os.environ.get("MATRIX_PLATFORM")

          # Move the Nuitka build output into our clean release folder
          if "macos" in platform_name:
              if os.path.exists("ppc2.app"):
                  shutil.move("ppc2.app", f"{release_dir}/ppc2.app")
                  target_bin_dir = f"{release_dir}/ppc2.app/Contents/Resources"
                  os.makedirs(target_bin_dir, exist_ok=True)
              else:
                  target_bin_dir = release_dir
          else:
              # Windows and Linux use ppc2.dist
              if os.path.exists("ppc2.dist"):
                  shutil.move("ppc2.dist", f"{release_dir}/ppc2.dist")
                  target_bin_dir = f"{release_dir}/ppc2.dist"
              else:
                  target_bin_dir = release_dir

          # Copy data/asset files DIRECTLY inside the binary/app folder
          for f in glob.glob("*holidays.json"):
              shutil.copy(f, target_bin_dir)
          if os.path.exists("CalendarHelp.png"):
              shutil.copy("CalendarHelp.png", target_bin_dir)
          if os.path.exists("readme.txt"):
              shutil.copy("readme.txt", target_bin_dir)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppc2-${{ matrix.platform }}-bundle
          path: release_output/
          retention-days: 30

      - name: Release to GitHub (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
