name: Build ppc2 Multi-Platform Apps with Nuitka

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Triggers when you push a version tag like v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: Build ppc2 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Spawns three independent, parallel runners
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Dependencies & Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard pygame

      # --- SECRET SOURCE CODE DECRYPTION ---
      # This recreates the hidden ppc2.py file dynamically on all runner environments
      - name: Recreate Python Source File from Secret
        shell: bash
        env:
          ENCODED_SOURCE: \${{ secrets.PPC2_SOURCE_CODE }}
        run: |
          echo "\$ENCODED_SOURCE" | base64 --decode > ppc2.py

      # --- MACOS SPECIFIC CONFIGURATION ---
      - name: Ensure Xcode Developer Directory is Set (macOS)
        if: matrix.os == 'macos-latest'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS App Bundle with Nuitka
        if: matrix.os == 'macos-latest'
        run: |
          python -m nuitka \
            --standalone \
            --macos-create-app-bundle \
            --output-filename=ppc2 \
            --macos-app-icon=ppc2.icns \
            --assume-yes-for-downloads \
            ppc2.py

      # --- WINDOWS SPECIFIC CONFIGURATION ---
      - name: Build Windows Executable with Nuitka
        if: matrix.os == 'windows-latest'
        run: |
          python -m nuitka `
            --standalone `
            --disable-console `
            --output-filename=ppc2 `
            --windows-icon-from-ico=ppc2.ico `
            --assume-yes-for-downloads `
            ppc2.py

      # --- LINUX SPECIFIC CONFIGURATION ---
      - name: Build Linux Executable with Nuitka
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m nuitka \
            --standalone \
            --output-filename=ppc2 \
            --assume-yes-for-downloads \
            ppc2.py

      # --- ASSET PACKAGING & DEPLOYMENT ---
      # Detects the operating system and bundles the binary along with your assets
      - name: Prepare Distribution Folder & Package Zip
        shell: bash
        run: |
          mkdir -p release_folder
          
          # Target binary movements dynamically based on the active runner OS
          if [ "\${{ matrix.os }}" = "macos-latest" ]; then
            mv ppc2.app release_folder/
            ZIP_NAME="ppc2ForMac.zip"
          elif [ "\${{ matrix.os }}" = "windows-latest" ]; then
            # Windows creates a folder named ppc2.dist containing ppc2.exe
            mv ppc2.dist release_folder/
            ZIP_NAME="ppc2ForWindows.zip"
          else
            # Linux creates a folder named ppc2.dist containing the linux binary
            mv ppc2.dist release_folder/
            ZIP_NAME="ppc2ForLinux.zip"
          fi
          
          # Safeguarded copy of your data/asset files beside the executable structures
          cp *holidays.json release_folder/ || echo "No holiday files found, skipping..."
          cp CalendarHelp.bmp release_folder/ || echo "CalendarHelp.bmp not found, skipping..."
          
          # Sweeps up the new readme.txt file and bundles it into the release folder
          cp readme.txt release_folder/ || echo "readme.txt not found, skipping..."
          
          # Zip up the contents natively across all runners
          cd release_folder
          if [ "\${{ matrix.os }}" = "windows-latest" ]; then
            powershell Compress-Archive -Path * -DestinationPath ../\$ZIP_NAME
          else
            zip -r ../\$ZIP_NAME *
          fi
          cd ..
          
          # Persist the output filename safely for downstream deployment steps
          echo "ZIP_OUTPUT=\(ZIP_NAME" >> \)GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppc2-\${{ matrix.os }}-bundle
          path: \${{ env.ZIP_OUTPUT }}
          retention-days: 30

      - name: Release to GitHub (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: \${{ env.ZIP_OUTPUT }}
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
